# CardDemo PostgreSQL migrations. They replace the IDCAMS DELETE/DEFINE/REPRO steps that built
# and loaded the VSAM clusters (jcl/*FILE.jcl, keys and AIX as listed in catlg/LISTCAT.txt).
# The revision chain in alembic/versions/ is linear, 0001 to 0009, and its head is 0009.
# The database URL comes from SYNC_DATABASE_URL, never from this file.
#
# From backend/:          ../.venv/bin/alembic upgrade head
# From any other folder:  pass this file with -c, for example
#                         .venv/bin/alembic -c backend/alembic.ini upgrade head

[alembic]
# %(here)s is the folder holding this file, so these paths resolve identically from the
# repository root, backend/, frontend/ and the container's /srv/backend.
script_location = %(here)s/alembic

# Puts backend/ on sys.path so env.py can import the app package even before the editable
# install of carddemo-backend.
prepend_sys_path = %(here)s

# Separator for a version_locations list, should one be added (Alembic 1.14 key).
version_path_separator = os

# New revision files are named <rev>_<slug>.py, like 0001_create_dataset_schemas_and_tables.py.
# Each revision sets its ID explicitly as a string ("0001" to "0009").
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

# No sqlalchemy.url key: env.py reads SYNC_DATABASE_URL from the process environment or
# backend/.env, so no database host, user or password is committed here
# (MK_Modernization Rule, clause 3).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
