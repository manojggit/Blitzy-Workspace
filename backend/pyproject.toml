[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carddemo-backend"
version = "1.0.0"
description = "CardDemo FastAPI backend replacing the CICS online programs and VSAM files"
requires-python = ">=3.13"
# Pins live only in the requirements files, so pip -r and pip install -e stay identical.
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
# Only the "app" package is distributed; batch imports it through the editable install.
# tests/ and alembic/ run in place from backend/ and are never packaged.
where = ["."]
include = ["app", "app.*"]

# The [tool.ruff] block is mirrored exactly in batch/pyproject.toml and kept self-contained,
# so each project lints standalone.
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
# extend-select keeps ruff's own default rule set. Ruff 0.17's defaults omit most of E4, E7
# and E9, so the classic E4, E7, E9 and F baseline is listed explicitly.
# No N (pep8-naming) rule is selected: its function, argument and variable rules demand
# snake_case, the opposite of the MK_Modernization Rule's PascalCase methods and camelCase
# variables. tests/test_code_standards.py checks naming instead. Ruff's default N999 checks
# only module file names, which are snake_case here, so it stays on.
extend-select = [
    # pycodestyle imports, statements and runtime errors, and pyflakes.
    "E4",
    "E7",
    "E9",
    "F",
    # MK_Modernization Rule clause 2, formatting: line length, no tab indentation,
    # and one statement per line so loops and conditionals are multi-line blocks.
    "E501",
    "W191",
    "E701",
    "E702",
    "E703",
    # MK_Modernization Rule clause 3, complexity: at most four parameters per function.
    "PLR0913",
    # MK_Modernization Rule clause 3, no hardcoding: hard-coded passwords and secrets.
    "S105",
    "S106",
    "S107",
    # MK_Modernization Rule clause 4, input cleaning: SQL built from strings.
    "S608",
    # MK_Modernization Rule clause 4, specific exceptions: broad, bare and silenced excepts.
    "BLE001",
    "E722",
    "S110",
]
# No ignore or per-file-ignores: a false positive is suppressed on its own line with
# "# noqa: <code>" and the reason.

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped async engine and client fixtures share one event loop with the tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
